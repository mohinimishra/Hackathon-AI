<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="InsureAssist - Your intelligent insurance companion powered by AI">
    <meta name="keywords" content="insurance, chatbot, AI assistant, insurance claims, coverage">
    <title>InsureAssist - AI Insurance Assistant</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="header-icon">🛡️</div>
                <div class="header-text">
                    <h1>InsureAssist</h1>
                    <p>Your AI-Powered Insurance Companion</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="clearChatBtn" title="Start a new conversation">
                    <span>🔄</span>
                    <span>New Chat</span>
                </button>
            </div>
        </div>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer">
            <!-- Messages will be dynamically added here -->
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-group">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Ask about policies, claims, coverage, or anything insurance-related..."
                    autocomplete="off"
                    aria-label="Type your insurance question"
                />
                <button class="btn-primary" id="sendBtn" aria-label="Send message">
                    Send
                </button>
            </div>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="app.js"></script>
</body>

</html>
